name: Build CaseonePOS Flutter APK

on:
  push:
    branches: [flutter-source-import]
    paths:
      - '.github/workflows/build-flutter-caseonepos.yml'
      - 'flutter_payload_v5/**'
      - 'flutter_payload_v5_fix/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: flutter-source-import

      - name: Restore verified Flutter source
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/caseonepos"
          rm -rf "$SRC"
          mkdir -p "$SRC"

          cat \
            flutter_payload_v5/part_00 \
            flutter_payload_v5/part_01 \
            flutter_payload_v5/part_02_03 \
            flutter_payload_v5/part_04_05 \
            flutter_payload_v5_fix/p06_0 \
            flutter_payload_v5_fix/p06_1 \
            flutter_payload_v5_fix/p07_0 \
            flutter_payload_v5_fix/p07_1 \
            flutter_payload_v5/part_08_09 \
            flutter_payload_v5/part_10_11 \
            flutter_payload_v5_fix/p12_0 \
            flutter_payload_v5_fix/p12_1 \
            flutter_payload_v5_fix/p13_0 \
            flutter_payload_v5_fix/p13_1 \
            flutter_payload_v5/part_14_15 \
            flutter_payload_v5/part_16_17 \
            flutter_payload_v5/part_18 \
            | tr -d '\r\n ' > "$RUNNER_TEMP/core_only.b64"

          CHARS=$(wc -c < "$RUNNER_TEMP/core_only.b64")
          echo "Base64 characters: $CHARS"
          test "$CHARS" -eq 186104

          base64 -d "$RUNNER_TEMP/core_only.b64" > "$RUNNER_TEMP/core_only.tar.xz"
          echo 'd9cbd6fe265b51bc8d3ecd3266233fcf92c57e283fcc03fdb732c8ba693fe47b  '"$RUNNER_TEMP/core_only.tar.xz" | sha256sum -c -
          xz -t "$RUNNER_TEMP/core_only.tar.xz"
          xz -dc "$RUNNER_TEMP/core_only.tar.xz" | tar -xf - -C "$SRC"

          test -s "$SRC/pubspec.yaml"
          test -s "$SRC/lib/main.dart"
          echo "CASEONE_SRC=$SRC" >> "$GITHUB_ENV"
          echo "Verified Flutter source restored successfully"

      - name: Prepare CaseonePOS assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          cd "$CASEONE_SRC"
          mkdir -p assets/images assets/fonts
          LOGO="$GITHUB_WORKSPACE/app/src/main/res/drawable/caseonepos_logo.png"
          test -s "$LOGO"
          cp "$LOGO" assets/images/logo.png
          cp "$LOGO" assets/images/logo_icon.png
          file assets/images/logo.png

      - name: Setup Flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android wrapper
        id: wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$CASEONE_SRC"
          flutter --version
          flutter create --platforms=android --org uz.caseonepos --project-name caseonepos .
          test -f android/app/src/main/AndroidManifest.xml

      - name: Apply CaseonePOS branding
        id: branding
        shell: bash
        run: |
          set -euo pipefail
          cd "$CASEONE_SRC"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          LOGO=assets/images/logo_icon.png

          sed -i 's/android:label="[^"]*"/android:label="CaseonePOS"/' "$MANIFEST"

          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          for dir in android/app/src/main/res/mipmap-*dpi; do
            [ -d "$dir" ] || continue
            cp "$LOGO" "$dir/ic_launcher.png"
            cp "$LOGO" "$dir/ic_launcher_round.png"
          done

          mkdir -p android/app/src/main/res/drawable
          cp "$LOGO" android/app/src/main/res/drawable/caseonepos_logo.png

          if grep -q 'android:icon=' "$MANIFEST"; then
            sed -i 's#android:icon="@[^"]*"#android:icon="@mipmap/ic_launcher"#' "$MANIFEST"
          else
            sed -i 's#<application#<application android:icon="@mipmap/ic_launcher"#' "$MANIFEST"
          fi
          if grep -q 'android:roundIcon=' "$MANIFEST"; then
            sed -i 's#android:roundIcon="@[^"]*"#android:roundIcon="@mipmap/ic_launcher_round"#' "$MANIFEST"
          else
            sed -i 's#<application#<application android:roundIcon="@mipmap/ic_launcher_round"#' "$MANIFEST"
          fi

          cat > android/app/src/main/res/drawable/launch_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />
              <item>
                  <bitmap android:gravity="center" android:src="@drawable/caseonepos_logo" />
              </item>
          </layer-list>
          XML

          mkdir -p android/app/src/main/res/values-v31
          cat > android/app/src/main/res/values-v31/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowSplashScreenBackground">#FFFFFF</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/caseonepos_logo</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          XML

          grep -n 'application\|label\|icon\|roundIcon' "$MANIFEST" | head -20
          test "$(grep -c 'android:label="CaseonePOS"' "$MANIFEST")" -ge 1
          test -s android/app/src/main/res/drawable/caseonepos_logo.png

      - name: Resolve Flutter dependencies
        id: pubget
        shell: bash
        run: |
          set -euo pipefail
          cd "$CASEONE_SRC"
          flutter pub get

      - name: Build debug APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          cd "$CASEONE_SRC"
          flutter build apk --debug
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/CaseonePOS-1.1.1-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/CaseonePOS-1.1.1-debug.apk" > "$GITHUB_WORKSPACE/CaseonePOS-1.1.1-debug.sha256"
          ls -lh "$GITHUB_WORKSPACE/CaseonePOS-1.1.1-debug.apk"

      - name: Upload CaseonePOS APK
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaseonePOS-Flutter-APK
          path: |
            CaseonePOS-1.1.1-debug.apk
            CaseonePOS-1.1.1-debug.sha256
          if-no-files-found: error

      - name: Record build status in repository
        if: always()
        shell: bash
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          {
            echo "CaseonePOS Flutter build report"
            echo "source_commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "job_status=${{ job.status }}"
            echo "restore=${{ steps.restore.outcome }}"
            echo "assets=${{ steps.assets.outcome }}"
            echo "flutter_setup=${{ steps.flutter.outcome }}"
            echo "wrapper=${{ steps.wrapper.outcome }}"
            echo "branding=${{ steps.branding.outcome }}"
            echo "pub_get=${{ steps.pubget.outcome }}"
            echo "apk_build=${{ steps.apk.outcome }}"
            echo "artifact=${{ steps.artifact.outcome }}"
            if [ -s CaseonePOS-1.1.1-debug.apk ]; then
              echo "apk_present=yes"
              echo "apk_size=$(wc -c < CaseonePOS-1.1.1-debug.apk)"
              sha256sum CaseonePOS-1.1.1-debug.apk
            else
              echo "apk_present=no"
            fi
          } > ci_build_status.txt
          cat ci_build_status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci_build_status.txt
          if ! git diff --cached --quiet; then
            git commit -m "CI: record CaseonePOS Flutter build status"
            git pull --rebase origin flutter-source-import || true
            git push origin HEAD:flutter-source-import || true
          fi
