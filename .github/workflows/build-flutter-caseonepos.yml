name: Diagnose CaseonePOS Flutter core

on:
  push:
    branches: [flutter-source-import]
    paths:
      - '.github/workflows/build-flutter-caseonepos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flutter-source-import

      - name: Test core combinations
        shell: bash
        run: |
          set -u
          report="$GITHUB_WORKSPACE/ci_core_variant_report.txt"
          : > "$report"
          test_variant() {
            name="$1"; shift
            echo "===== $name =====" | tee -a "$report"
            cat "$@" | tr -d '\r\n ' > /tmp/payload.b64
            echo "base64_chars=$(wc -c < /tmp/payload.b64)" | tee -a "$report"
            if ! base64 -d /tmp/payload.b64 > /tmp/payload.bin 2>/tmp/b64.err; then
              echo "base64=INVALID" | tee -a "$report"
              cat /tmp/b64.err >> "$report" || true
              echo >> "$report"
              return
            fi
            echo "decoded_bytes=$(wc -c < /tmp/payload.bin)" | tee -a "$report"
            echo "file=$(file -b /tmp/payload.bin)" | tee -a "$report"
            if xz -t /tmp/payload.bin >/dev/null 2>&1; then
              echo "xz=VALID" | tee -a "$report"
              if xz -dc /tmp/payload.bin | tar -tf - >/tmp/list.txt 2>/tmp/tar.err; then
                echo "tar=VALID" | tee -a "$report"
                grep -E '(^|/)pubspec.yaml$|(^|/)lib/main.dart$|(^|/)android/' /tmp/list.txt | head -40 >> "$report" || true
              else
                echo "tar=INVALID" | tee -a "$report"
                cat /tmp/tar.err >> "$report" || true
              fi
            else
              echo "xz=INVALID" | tee -a "$report"
            fi
            echo >> "$report"
          }

          common_after=(
            caseonepos_core_v111/part_002
            caseonepos_core_v111/part_003
            caseonepos_core_v111/part_004
            caseonepos_core_v111/part_005
            caseonepos_core_v111/part_006
            caseonepos_core_v111/part_007
            caseonepos_core_v111/part_008
            caseonepos_core_v111/part_009
          )

          test_variant "with_part_001" \
            caseonepos_core_v111/part_000 \
            caseonepos_core_v111/part_001 \
            "${common_after[@]}"

          test_variant "with_part_001a" \
            caseonepos_core_v111/part_000 \
            caseonepos_core_v111/part_001a \
            "${common_after[@]}"

      - name: Commit diagnostic report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci_core_variant_report.txt
          if ! git diff --cached --quiet; then
            git commit -m "CI: record core variant diagnostic"
            git push origin HEAD:flutter-source-import
          fi
