name: Verify CaseonePOS 1.1.4 original payload

on:
  push:
    branches: [restore-caseonepos-1.1.4]
    paths:
      - '.github/workflows/verify-caseonepos-114-original-part05.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          cat payload_1_1_4_v2/part_00.b64 payload_1_1_4_v2/part_01.b64 payload_1_1_4_v2/part_02.b64 payload_1_1_4_v2/part_03.b64 payload_1_1_4_v2/part_04.b64 payload_1_1_4_v2/part_05.b64 | tr -d '\r\n ' > "$RUNNER_TEMP/source.b64"
          base64 -d "$RUNNER_TEMP/source.b64" > "$RUNNER_TEMP/source.tar.xz"
          xz -t "$RUNNER_TEMP/source.tar.xz"
          mkdir -p "$RUNNER_TEMP/src"
          tar -xJf "$RUNNER_TEMP/source.tar.xz" -C "$RUNNER_TEMP/src"
          PUBSPEC=$(find "$RUNNER_TEMP/src" -maxdepth 3 -name pubspec.yaml -print -quit)
          test -n "$PUBSPEC"
          SRC=$(dirname "$PUBSPEC")
          grep -q '^version: 1.1.4+13' "$SRC/pubspec.yaml"
          echo '52ca46769d493b9d2f0a6af4389dfa4e098adb11fd6d7fb561ba8814e102cc09  '"$SRC/pubspec.yaml" | sha256sum -c -
          echo '0ec15f78f439d8e9e29ada1b8e9ef4cd577a61ab8676098daacb8fb5ff78cdbc  '"$SRC/lib/main.dart" | sha256sum -c -
          echo '640739fa58df8d3dd2d9cd7f8841cf8707fcf4b39bd4a00e559aae08f93eefcc  '"$SRC/lib/services/backup_service.dart" | sha256sum -c -
          echo '5250fd05146806860261050982a6633433fc606e38c4ca81a521c8ee2cf0d3d0  '"$SRC/lib/screens/system_settings_screen.dart" | sha256sum -c -
      - name: Record verification
        if: always()
        shell: bash
        run: |
          set +e
          echo "verify=${{ steps.verify.outcome }}" > caseonepos_1_1_4_exact_verify.txt
          echo "run_id=$GITHUB_RUN_ID" >> caseonepos_1_1_4_exact_verify.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- caseonepos_1_1_4_exact_verify.txt
          git commit -m 'CI: record exact 1.1.4 verification' || exit 0
          git push origin HEAD:restore-caseonepos-1.1.4 || true
