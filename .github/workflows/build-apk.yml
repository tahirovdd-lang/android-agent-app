name: Build CaseonePOS 1.1.4 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'payload_1_1_4/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore verified CaseonePOS 1.1.4 source
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/caseonepos114"
          rm -rf "$SRC" && mkdir -p "$SRC"
          tr -d '\r\n ' < payload_1_1_4/core.b64 > "$RUNNER_TEMP/caseonepos114.b64"
          base64 -d "$RUNNER_TEMP/caseonepos114.b64" > "$RUNNER_TEMP/caseonepos114.tar.xz"
          xz -t "$RUNNER_TEMP/caseonepos114.tar.xz"
          tar -xJf "$RUNNER_TEMP/caseonepos114.tar.xz" -C "$SRC"
          test -s "$SRC/pubspec.yaml"
          test -s "$SRC/lib/main.dart"
          test -s "$SRC/android/app/build.gradle"
          grep -q 'version: 1.1.4+13' "$SRC/pubspec.yaml"
          sha256sum "$RUNNER_TEMP/caseonepos114.tar.xz"
          echo "CASEONE_SRC=$SRC" >> "$GITHUB_ENV"

      - name: Setup Flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android 1.1.4
        id: android
        shell: bash
        run: |
          set -euo pipefail
          cd "$CASEONE_SRC"
          LOGO="$GITHUB_WORKSPACE/app/src/main/res/drawable/caseonepos_logo.png"
          test -s "$LOGO"
          mkdir -p assets/images assets/fonts
          cp "$LOGO" assets/images/logo.png
          cp "$LOGO" assets/images/logo_icon.png

          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="CaseonePOS"/' "$MANIFEST"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"
          fi
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's#<application#<application android:usesCleartextTraffic="true"#' "$MANIFEST"
          fi

          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$d"
            cp "$LOGO" "android/app/src/main/res/mipmap-$d/ic_launcher.png"
          done
          sed -i 's#android:icon="@[^"]*"#android:icon="@mipmap/ic_launcher"#' "$MANIFEST"

          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/drawable-v21
          cp "$LOGO" android/app/src/main/res/drawable/caseonepos_logo.png
          cat > android/app/src/main/res/drawable/launch_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />
              <item><bitmap android:gravity="center" android:src="@drawable/caseonepos_logo" /></item>
          </layer-list>
          XML
          cp android/app/src/main/res/drawable/launch_background.xml android/app/src/main/res/drawable-v21/launch_background.xml

          mkdir -p android/app/src/main/res/values-v31
          cat > android/app/src/main/res/values-v31/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowSplashScreenBackground">#FFFFFF</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/caseonepos_logo</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          XML

          APP_GRADLE=android/app/build.gradle
          sed -i -E 's/compileSdk[[:space:]]+flutter\.compileSdkVersion/compileSdk 36/' "$APP_GRADLE"
          sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/' "$APP_GRADLE"
          sed -i -E 's/compileSdk[[:space:]]+[0-9]+/compileSdk 36/' "$APP_GRADLE"
          grep -n 'compileSdk' "$APP_GRADLE"
          grep -n 'CaseonePOS\|INTERNET\|usesCleartextTraffic\|icon' "$MANIFEST"

      - name: Resolve dependencies
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          cd "$CASEONE_SRC"
          flutter pub get
          PICKER="$(find "$PUB_CACHE/hosted" -path '*/file_picker-8.3.7/android/build.gradle' -print -quit)"
          test -n "$PICKER"
          sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/' "$PICKER"
          sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/' "$PICKER"
          sed -i -E 's/compileSdk[[:space:]]+[0-9]+/compileSdk 36/' "$PICKER"
          grep -n 'compileSdk' "$PICKER"
          grep -qE 'compileSdk(Version)?([[:space:]]*=)?[[:space:]]*36' "$PICKER"

      - name: Flutter analyze critical startup files
        id: analyze
        shell: bash
        run: |
          set -euo pipefail
          cd "$CASEONE_SRC"
          dart analyze lib/main.dart lib/services/db_service.dart lib/services/server_config_service.dart || true

      - name: Build CaseonePOS 1.1.4 APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          cd "$CASEONE_SRC"
          flutter build apk --debug
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/CaseonePOS-1.1.4.apk"
          sha256sum "$GITHUB_WORKSPACE/CaseonePOS-1.1.4.apk" > "$GITHUB_WORKSPACE/CaseonePOS-1.1.4.sha256"
          ls -lh "$GITHUB_WORKSPACE/CaseonePOS-1.1.4.apk"

      - name: Upload CaseonePOS 1.1.4 APK
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaseonePOS-1.1.4-APK
          path: |
            CaseonePOS-1.1.4.apk
            CaseonePOS-1.1.4.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Record build result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          {
            echo "CaseonePOS 1.1.4 APK build report"
            echo "run_id=$GITHUB_RUN_ID"
            echo "job_status=${{ job.status }}"
            echo "restore=${{ steps.restore.outcome }}"
            echo "flutter=${{ steps.flutter.outcome }}"
            echo "android=${{ steps.android.outcome }}"
            echo "dependencies=${{ steps.deps.outcome }}"
            echo "analyze=${{ steps.analyze.outcome }}"
            echo "apk_build=${{ steps.apk.outcome }}"
            echo "artifact=${{ steps.artifact.outcome }}"
            if [ -s CaseonePOS-1.1.4.apk ]; then
              echo "apk_present=yes"
              echo "apk_size=$(wc -c < CaseonePOS-1.1.4.apk)"
              sha256sum CaseonePOS-1.1.4.apk
            else
              echo "apk_present=no"
            fi
          } > caseonepos_1_1_4_build_status.txt
          CONTENT=$(base64 -w0 caseonepos_1_1_4_build_status.txt)
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/caseonepos_1_1_4_build_status.txt?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/caseonepos_1_1_4_build_status.txt" -f message='CI: update CaseonePOS 1.1.4 build status' -f content="$CONTENT" -f branch=main -f sha="$SHA" >/dev/null || true
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/caseonepos_1_1_4_build_status.txt" -f message='CI: add CaseonePOS 1.1.4 build status' -f content="$CONTENT" -f branch=main >/dev/null || true
          fi
