name: Validate CaseonePOS Flutter payload

on:
  push:
    branches: [ "flutter-source-import" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate uploaded Flutter payload
        shell: bash
        run: |
          set -euo pipefail
          echo "Uploaded parts:"
          ls -lh caseonepos_payload_v111_parts/part_*
          cat caseonepos_payload_v111_parts/part_* > /tmp/caseonepos.b64
          echo "Base64 bytes: $(wc -c < /tmp/caseonepos.b64)"
          base64 --decode /tmp/caseonepos.b64 > /tmp/caseonepos.tar.xz
          echo "Archive bytes: $(wc -c < /tmp/caseonepos.tar.xz)"
          sha256sum /tmp/caseonepos.tar.xz
          xz --test /tmp/caseonepos.tar.xz
          mkdir -p /tmp/caseonepos
          tar -xJf /tmp/caseonepos.tar.xz -C /tmp/caseonepos
          find /tmp/caseonepos -maxdepth 3 -type f | sort | head -120
          test -f /tmp/caseonepos/pubspec.yaml
          test -f /tmp/caseonepos/lib/main.dart
          test -f /tmp/caseonepos/android/app/src/main/AndroidManifest.xml
          echo "PAYLOAD_OK"
