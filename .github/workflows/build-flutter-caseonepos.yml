name: Build CaseonePOS Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct Flutter source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p caseonepos_flutter
          cat caseonepos_source/chunk_* > /tmp/caseonepos.b64
          base64 --decode /tmp/caseonepos.b64 > /tmp/caseonepos.tar.xz
          xz --test /tmp/caseonepos.tar.xz
          tar -xJf /tmp/caseonepos.tar.xz -C caseonepos_flutter
          echo "Extracted source:"
          find caseonepos_flutter -maxdepth 2 -type f | sort | head -100
          test -f caseonepos_flutter/pubspec.yaml
          test -f caseonepos_flutter/lib/main.dart
          test -f caseonepos_flutter/android/app/src/main/AndroidManifest.xml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        working-directory: caseonepos_flutter
        run: flutter doctor -v

      - name: Get Flutter dependencies
        working-directory: caseonepos_flutter
        run: flutter pub get

      - name: Analyze project
        working-directory: caseonepos_flutter
        run: flutter analyze --no-fatal-infos

      - name: Build Android APK
        working-directory: caseonepos_flutter
        run: flutter build apk --debug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="caseonepos_flutter/build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK"
          cp "$APK" CaseonePOS-Flutter-debug.apk
          sha256sum CaseonePOS-Flutter-debug.apk > apk-sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CaseonePOS-Flutter-APK
          path: |
            CaseonePOS-Flutter-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
