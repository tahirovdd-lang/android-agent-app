name: Build CaseonePOS Flutter APK

on:
  push:
    branches:
      - flutter-source-import
    paths:
      - '.github/workflows/build-flutter-caseonepos.yml'
      - 'caseonepos_*/*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect valid Flutter payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/caseone_detect /tmp/caseone_src
          mkdir -p /tmp/caseone_detect /tmp/caseone_src

          candidates=(
            caseonepos_core_v111
            caseonepos_payload_v111_parts
            caseonepos_ultra_parts
            caseonepos_code_payload_verified
            caseonepos_payload_clean
            caseonepos_payload_final
            caseonepos_source
            caseonepos_code_parts
          )

          chosen=''
          for dir in "${candidates[@]}"; do
            [ -d "$dir" ] || continue
            echo "===== CHECKING $dir ====="
            mapfile -t files < <(find "$dir" -maxdepth 1 -type f | sort -V)
            [ "${#files[@]}" -gt 0 ] || continue
            printf 'Files: %s\n' "${files[*]}"
            cat "${files[@]}" | tr -d '\r\n ' > /tmp/caseone_detect/payload.b64
            echo "Base64 chars: $(wc -c < /tmp/caseone_detect/payload.b64)"

            if ! base64 -d /tmp/caseone_detect/payload.b64 > /tmp/caseone_detect/payload.bin 2>/tmp/caseone_detect/base64.err; then
              echo "Base64 decode failed"
              cat /tmp/caseone_detect/base64.err || true
              continue
            fi

            echo "Decoded: $(file /tmp/caseone_detect/payload.bin)"

            rm -rf /tmp/caseone_detect/extract
            mkdir -p /tmp/caseone_detect/extract

            if xz -t /tmp/caseone_detect/payload.bin >/dev/null 2>&1; then
              echo "XZ stream valid"
              if ! xz -dc /tmp/caseone_detect/payload.bin | tar -tf - > /tmp/caseone_detect/list.txt 2>/tmp/caseone_detect/tar.err; then
                echo "Not a tar.xz payload"
                cat /tmp/caseone_detect/tar.err || true
                continue
              fi
              echo 'Archive preview:'
              head -40 /tmp/caseone_detect/list.txt
              xz -dc /tmp/caseone_detect/payload.bin | tar -xf - -C /tmp/caseone_detect/extract
            elif unzip -t /tmp/caseone_detect/payload.bin >/dev/null 2>&1; then
              echo "ZIP payload valid"
              unzip -q /tmp/caseone_detect/payload.bin -d /tmp/caseone_detect/extract
            else
              echo "Unsupported payload type"
              continue
            fi

            root="/tmp/caseone_detect/extract"
            pubspec=$(find "$root" -name pubspec.yaml -type f | head -1 || true)
            main=$(find "$root" -path '*/lib/main.dart' -type f | head -1 || true)
            if [ -n "$pubspec" ] && [ -n "$main" ]; then
              project_dir=$(dirname "$pubspec")
              echo "VALID FLUTTER PROJECT: $project_dir"
              cp -a "$project_dir/." /tmp/caseone_src/
              chosen="$dir"
              break
            fi

            echo "Payload extracted but no pubspec.yaml + lib/main.dart pair found"
          done

          if [ -z "$chosen" ]; then
            echo 'ERROR: No valid Flutter source payload found.'
            exit 1
          fi

          echo "CASEONE_PAYLOAD=$chosen" >> "$GITHUB_ENV"
          echo "CASEONE_SRC=/tmp/caseone_src" >> "$GITHUB_ENV"
          echo "Selected payload: $chosen"
          find /tmp/caseone_src -maxdepth 2 -type f | sort | head -80

      - name: Prepare Android project and CaseonePOS branding
        shell: bash
        run: |
          set -euo pipefail
          cd "$CASEONE_SRC"

          # If the archived core has no Android wrapper, Flutter will generate it.
          if [ ! -d android ]; then
            echo 'Android wrapper missing; it will be generated after Flutter setup.'
          fi

          # Make sure asset folders referenced by the original project exist.
          mkdir -p assets/images assets/fonts

          # Reuse the original CaseonePOS logo already stored in this repository
          # if the core payload does not include image assets.
          if [ ! -s assets/images/logo.png ] && [ -s "$GITHUB_WORKSPACE/app/src/main/res/drawable/caseonepos_logo.png" ]; then
            cp "$GITHUB_WORKSPACE/app/src/main/res/drawable/caseonepos_logo.png" assets/images/logo.png
          fi
          if [ ! -s assets/images/logo_icon.png ] && [ -s "$GITHUB_WORKSPACE/app/src/main/res/drawable/caseonepos_logo.png" ]; then
            cp "$GITHUB_WORKSPACE/app/src/main/res/drawable/caseonepos_logo.png" assets/images/logo_icon.png
          fi

          file assets/images/logo.png || true
          file assets/images/logo_icon.png || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android wrapper if needed
        shell: bash
        run: |
          set -euo pipefail
          cd "$CASEONE_SRC"
          flutter --version
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.artdom --project-name caseonepos .
          fi

      - name: Force CaseonePOS Android name and launcher icon
        shell: bash
        run: |
          set -euo pipefail
          cd "$CASEONE_SRC"

          manifest=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="CaseonePOS"/' "$manifest"

          mkdir -p android/app/src/main/res/drawable
          cp assets/images/logo_icon.png android/app/src/main/res/drawable/caseonepos_logo.png
          sed -i 's#android:icon="@[^"]*"#android:icon="@drawable/caseonepos_logo"#' "$manifest"

          echo '--- AndroidManifest.xml ---'
          sed -n '1,80p' "$manifest"
          test "$(grep -c 'android:label="CaseonePOS"' "$manifest")" -ge 1
          test "$(grep -c 'android:icon="@drawable/caseonepos_logo"' "$manifest")" -ge 1

      - name: Resolve Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$CASEONE_SRC"
          flutter pub get

      - name: Analyze project
        shell: bash
        continue-on-error: true
        run: |
          cd "$CASEONE_SRC"
          flutter analyze

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$CASEONE_SRC"
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/CaseonePOS-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/CaseonePOS-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/CaseonePOS-debug.apk"

      - name: Upload CaseonePOS APK
        uses: actions/upload-artifact@v4
        with:
          name: CaseonePOS-Flutter-APK
          path: CaseonePOS-debug.apk
          if-no-files-found: error
