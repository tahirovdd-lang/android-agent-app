name: Validate CaseonePOS Flutter payload

on:
  push:
    branches: [ "flutter-source-import" ]
    paths-ignore:
      - "payload-validation.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate uploaded Flutter payload
        id: validate
        shell: bash
        run: |
          set +e
          REPORT="payload-validation.txt"
          : > "$REPORT"
          echo "commit=${GITHUB_SHA}" >> "$REPORT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$REPORT"

          PART_COUNT=$(find caseonepos_payload_v111_parts -maxdepth 1 -type f -name 'part_*' | wc -l)
          echo "parts=${PART_COUNT}" >> "$REPORT"

          cat caseonepos_payload_v111_parts/part_* > /tmp/caseonepos.b64
          B64_BYTES=$(wc -c < /tmp/caseonepos.b64)
          echo "base64_bytes=${B64_BYTES}" >> "$REPORT"

          base64 --decode /tmp/caseonepos.b64 > /tmp/caseonepos.tar.xz 2>/tmp/base64.err
          DECODE_STATUS=$?
          echo "base64_decode_status=${DECODE_STATUS}" >> "$REPORT"
          if [ -s /tmp/base64.err ]; then
            echo "base64_error=$(tr '\n' ' ' < /tmp/base64.err)" >> "$REPORT"
          fi

          ARCHIVE_BYTES=$(wc -c < /tmp/caseonepos.tar.xz)
          echo "archive_bytes=${ARCHIVE_BYTES}" >> "$REPORT"
          echo "archive_sha256=$(sha256sum /tmp/caseonepos.tar.xz | awk '{print $1}')" >> "$REPORT"

          xz --test /tmp/caseonepos.tar.xz 2>/tmp/xz.err
          XZ_STATUS=$?
          echo "xz_status=${XZ_STATUS}" >> "$REPORT"
          if [ -s /tmp/xz.err ]; then
            echo "xz_error=$(tr '\n' ' ' < /tmp/xz.err)" >> "$REPORT"
          fi

          if [ "$DECODE_STATUS" -eq 0 ] && [ "$XZ_STATUS" -eq 0 ]; then
            rm -rf /tmp/caseonepos
            mkdir -p /tmp/caseonepos
            tar -xJf /tmp/caseonepos.tar.xz -C /tmp/caseonepos 2>/tmp/tar.err
            TAR_STATUS=$?
            echo "tar_status=${TAR_STATUS}" >> "$REPORT"
            if [ "$TAR_STATUS" -eq 0 ]; then
              test -f /tmp/caseonepos/pubspec.yaml; PUBSPEC=$?
              test -f /tmp/caseonepos/lib/main.dart; MAIN=$?
              test -f /tmp/caseonepos/android/app/src/main/AndroidManifest.xml; MANIFEST=$?
              echo "pubspec_status=${PUBSPEC}" >> "$REPORT"
              echo "main_dart_status=${MAIN}" >> "$REPORT"
              echo "manifest_status=${MANIFEST}" >> "$REPORT"
              if [ "$PUBSPEC" -eq 0 ] && [ "$MAIN" -eq 0 ] && [ "$MANIFEST" -eq 0 ]; then
                echo "result=PAYLOAD_OK" >> "$REPORT"
                FINAL_STATUS=0
              else
                echo "result=PAYLOAD_MISSING_REQUIRED_FILES" >> "$REPORT"
                FINAL_STATUS=1
              fi
            else
              echo "tar_error=$(tr '\n' ' ' < /tmp/tar.err)" >> "$REPORT"
              echo "result=PAYLOAD_TAR_ERROR" >> "$REPORT"
              FINAL_STATUS=1
            fi
          else
            echo "result=PAYLOAD_CORRUPT_OR_INCOMPLETE" >> "$REPORT"
            FINAL_STATUS=1
          fi

          cat "$REPORT"
          echo "final_status=${FINAL_STATUS}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit validation report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payload-validation.txt
          git diff --cached --quiet || git commit -m "Record Flutter payload validation result"
          git push

      - name: Fail job when payload is invalid
        if: steps.validate.outputs.final_status != '0'
        run: exit 1
